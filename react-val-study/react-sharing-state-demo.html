<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>React 验证:组件间共享数据(状态提升)</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1220; color: #e2e8f0; font-family: system-ui, "Microsoft YaHei", sans-serif; padding: 24px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .intro { color: #94a3b8; font-size: 14px; line-height: 1.8; margin-bottom: 20px; }
  .intro a { color: #7dd3fc; }
  code, pre { font-family: Consolas, "JetBrains Mono", monospace; }
  .intro code { background: #1e293b; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .card { background: #111a2e; border: 1px solid #24324d; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h2 code { color: #7dd3fc; font-size: 14px; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.ok { background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.4); }
  .tag.bad { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.4); }
  .tag.info { background: rgba(96,165,250,.15); color: #60a5fa; border: 1px solid rgba(96,165,250,.4); }
  pre { background: #0b1220; border: 1px solid #24324d; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #7dd3fc; overflow-x: auto; line-height: 1.6; }
  .note { font-size: 12.5px; line-height: 1.7; padding: 8px 10px; border-radius: 8px; }
  .note.ok { background: rgba(34,197,94,.08); color: #86efac; }
  .note.info { background: rgba(96,165,250,.08); color: #93c5fd; }
  .note.bad { background: rgba(239,68,68,.08); color: #fca5a5; }
  .live { display: flex; flex-direction: column; gap: 10px; }
  .live .row2 { display: flex; gap: 12px; flex-wrap: wrap; }
  .big { padding: 12px 16px; font-size: 15px; border-radius: 8px; border: 1px solid #3b82f6; background: #1d4ed8; color: #fff; cursor: pointer; }
  .big:hover { background: #2563eb; }
  .big.ok { border-color: #22c55e; background: #14532d; }
  .big.ok:hover { background: #166534; }
  .big.bad { border-color: #ef4444; background: #7f1d1d; }
  .big.bad:hover { background: #991b1b; }
  .remount { padding: 8px 12px; font-size: 13px; border-radius: 8px; border: 1px dashed #475569; background: transparent; color: #cbd5e1; cursor: pointer; }
  .remount:hover { border-color: #94a3b8; }
  .kv { font-size: 14px; color: #cbd5e1; }
  .kv b { color: #fbbf24; font-size: 17px; }
  .panel { border: 1px solid #24324d; border-radius: 8px; padding: 10px 12px; background: #0b1220; }
  .panel.open { border-color: #3b82f6; }
  .panel h3 { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #cbd5e1; gap: 8px; }
  .panel p { margin-top: 8px; font-size: 13px; color: #94a3b8; line-height: 1.7; }
  .mini { padding: 4px 14px; font-size: 12.5px; border-radius: 6px; border: 1px solid #3b82f6; background: transparent; color: #93c5fd; cursor: pointer; white-space: nowrap; }
  .mini:hover { background: rgba(59,130,246,.15); }
  .logs { flex: 1; min-height: 120px; max-height: 240px; overflow-y: auto; background: #0b1220; border: 1px solid #24324d; border-radius: 8px; padding: 8px 10px; font-family: Consolas, monospace; font-size: 12.5px; line-height: 1.9; }
  .logs .empty { color: #475569; }
  .log-time { color: #64748b; margin-right: 4px; }
  footer { margin-top: 20px; color: #64748b; font-size: 13px; line-height: 1.9; }
  footer code { background: #1e293b; padding: 1px 6px; border-radius: 4px; color: #7dd3fc; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function now() {
  const d = new Date();
  return d.toLocaleTimeString("zh-CN", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0");
}

// 日志直接写 DOM(绕开 React 状态),保证时间顺序真实、不受渲染干扰
function log(panelId, msg, color) {
  const box = document.getElementById(panelId);
  if (!box) return; // 首次渲染提交到 DOM 之前,日志容器还不存在
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  const row = document.createElement("div");
  const t = document.createElement("span");
  t.className = "log-time";
  t.textContent = "[" + now() + "] ";
  const m = document.createElement("span");
  m.textContent = msg;
  m.style.color = color || "#cbd5e1";
  row.appendChild(t);
  row.appendChild(m);
  box.prepend(row);
  while (box.children.length > 100) box.removeChild(box.lastChild);
}

/* ─────────── 卡片 A:官方图示 —— 每个 MyButton 的 count 都是私有的 ─────────── */
function MyButtonSolo({ label, logId }) {
  const [count, setCount] = useState(0); // 每个实例各有一格独立的账
  function handleClick() {
    setCount(count + 1);
    log(logId, label + ":自己的 count " + count + " → " + (count + 1) + "(另一个按钮不受影响)", "#4ade80");
  }
  return (
    <button className="big" onClick={handleClick}>
      {label}:点了 {count} 次
    </button>
  );
}

function IndependentDemo({ logId }) {
  return (
    <div className="row2">
      <MyButtonSolo logId={logId} label="按钮 A" />
      <MyButtonSolo logId={logId} label="按钮 B" />
    </div>
  );
}

/* ─────────── 卡片 B:状态提升 —— count 搬进公共父组件 ─────────── */
function LiftedButton({ label, count, onClick }) {
  return (
    <button className="big ok" onClick={onClick}>
      {label}:点了 {count} 次
    </button>
  );
}

function LiftedDemo({ logId }) {
  const [count, setCount] = useState(0); // state 住在父组件里,是唯一数据源
  function handleClick(from) {
    setCount(count + 1);
    log(logId, from + " 被点 → 父组件 setCount(" + (count + 1) + ") → 父重渲染,按钮 A、B 一起收到新 props count=" + (count + 1), "#60a5fa");
  }
  return (
    <div>
      <div className="kv">父组件的 count = <b>{count}</b>(唯一数据源,按钮只负责显示)</div>
      <div className="row2">
        <LiftedButton label="按钮 A" count={count} onClick={() => handleClick("按钮 A")} />
        <LiftedButton label="按钮 B" count={count} onClick={() => handleClick("按钮 B")} />
      </div>
    </div>
  );
}

/* ─────────── 卡片 C:单一数据源 —— 手风琴(同时只展开一个面板) ─────────── */
function Panel({ title, isOpen, onToggle, children }) {
  return (
    <div className={"panel" + (isOpen ? " open" : "")}>
      <h3>
        <span>{title}{isOpen ? "(展开中)" : "(已收起)"}</span>
        <button className="mini" onClick={onToggle}>{isOpen ? "收起" : "展开"}</button>
      </h3>
      {isOpen && <p>{children}</p>}
    </div>
  );
}

function AccordionDemo({ logId }) {
  const [activeIndex, setActiveIndex] = useState(0);
  function toggle(i) {
    const next = activeIndex === i ? -1 : i;
    setActiveIndex(next);
    log(logId, "父组件 setActiveIndex(" + next + ") → 两块面板按新 props 重新渲染:只有 index=" + next + " 的展开", "#4ade80");
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      <div className="kv">父组件的 activeIndex = <b>{activeIndex}</b>(两块面板共用这一格 state)</div>
      <Panel title="面板 ①" isOpen={activeIndex === 0} onToggle={() => toggle(0)}>
        我是面板 ① 的内容——「是否展开」存在父组件里,面板自己没有 state,完全由 props 驱动。
      </Panel>
      <Panel title="面板 ②" isOpen={activeIndex === 1} onToggle={() => toggle(1)}>
        我是面板 ② 的内容——点开我,面板 ① 自动收起:同一份数据只存一处。
      </Panel>
    </div>
  );
}

/* ─────────── 卡片 D:反面教材 —— 把 props 拷进子组件 state ─────────── */
function CopyChild({ name, value }) {
  const [copied] = useState(value); // 初值只在「首次渲染」那一刻被采用,之后与 props 无关
  return <div className="kv">{name} 拷贝到的值 = <b>{copied}</b></div>;
}

function CopyDemo({ logId }) {
  const [outer, setOuter] = useState(100);
  return (
    <div>
      <div className="kv">父组件的 outer = <b>{outer}</b></div>
      <div className="row2">
        <CopyChild name="子组件 A" value={outer} />
        <CopyChild name="子组件 B" value={outer} />
      </div>
      <button className="big bad" onClick={() => {
        setOuter(outer + 1);
        log(logId, "父组件 outer → " + (outer + 1) + ":子组件收到了新 props,但拷贝的初值不会更新 → 失步!", "#f87171");
      }}>父组件 outer + 1</button>
      <button className="remount" onClick={() => {
        setOuter(100);
        log(logId, "重置:outer 回到 100。注意子组件拷贝的值纹丝不动——它和父组件早就无关了", "#94a3b8");
      }}>🔄 重置</button>
    </div>
  );
}

/* ─────────── 通用卡片外壳 ─────────── */
function Card(props) {
  return (
    <section className="card">
      <h2>
        <span className={"tag " + props.tagClass}>{props.tag}</span>
        <code>{props.title}</code>
      </h2>
      <pre>{props.code}</pre>
      <div className={"note " + props.noteClass}>{props.note}</div>
      <div className="live">{props.children}</div>
      <div className="logs" id={props.logId}>
        <div className="empty">暂无日志…</div>
      </div>
    </section>
  );
}

function App() {
  return (
    <div className="wrap">
      <h1>🔍 验证:组件间共享数据 —— 状态提升(Lifting State Up)</h1>
      <p className="intro">
        本页验证 React 官方文档快速入门(<a href="https://zh-hans.react.dev/learn/sharing-state-between-components" target="_blank" rel="noreferrer">zh-hans.react.dev/learn/sharing-state-between-components</a>)的
        「<b>组件间共享数据</b>」一节;state 基础见 <code>react-usestate-demo.html</code>。
        <br />
        四张卡片分别对应四个问题:① 官方图示场景——为什么两个按钮的 count 互不影响;② 要共享怎么办——把 state 提升到公共父组件;③ 单一数据源——手风琴同时只展开一个;④ 反面教材——把 props 拷进子组件 state 为什么必然失步。
      </p>

      <div className="cards">
        <Card
          tag="📖 官方图示" tagClass="ok"
          title="每个 MyButton 的 count 是私有的"
          code={"function MyButton() {\n  const [count, setCount] = useState(0);\n  // state 跟着「组件实例」走\n}\n\n<MyButton />  // 实例 1:独立一格账\n<MyButton />  // 实例 2:独立一格账"}
          note="对应官方图示:起初两个 MyButton 的 count 均为 0;点第一个,只有它更新为 1。JSX 里把组件写两遍 = 两个实例、两份互不相干的 state。"
          noteClass="ok" logId="logs-a"
        >
          <IndependentDemo logId="logs-a" />
        </Card>

        <Card
          tag="⬆️ 状态提升" tagClass="info"
          title="count 搬进公共父组件"
          code={"function MyApp() {          // 公共父组件\n  const [count, setCount] = useState(0);\n  return (\n    <>\n      <MyButton count={count}\n        onClick={() => setCount(count + 1)} />\n      <MyButton count={count}\n        onClick={() => setCount(count + 1)} />\n    </>\n  );\n}"}
          note="提升后按钮变成「受控组件」:数据完全由父组件的 props 驱动,点击通过回调上报。数据单向流:父 →(props)→ 子;子 →(回调)→ 父。点任意一个按钮,两个数字一起变。"
          noteClass="info" logId="logs-b"
        >
          <LiftedDemo logId="logs-b" />
        </Card>

        <Card
          tag="🎯 单一数据源" tagClass="ok"
          title="手风琴:同时只展开一个面板"
          code={"function Accordion() {\n  const [activeIndex, setActiveIndex] = useState(0);\n  return (\n    <>\n      <Panel isOpen={activeIndex === 0}\n        onShow={() => setActiveIndex(0)} />\n      <Panel isOpen={activeIndex === 1}\n        onShow={() => setActiveIndex(1)} />\n    </>\n  );\n}"}
          note="「同时只展开一个」不是两份 state 硬协调,而是由 activeIndex 一格 state 派生出两块面板的展开状态:同一份数据只存一处(single source of truth)。"
          noteClass="ok" logId="logs-c"
        >
          <AccordionDemo logId="logs-c" />
        </Card>

        <Card
          tag="🔬 对照(坑)" tagClass="bad"
          title="复制 props ≠ 共享"
          code={"function Child({ value }) {\n  // ❌ 只拷到「首次渲染」那一刻的初值\n  const [copied] = useState(value);\n}\n// 之后 value 再变,copied 不跟着动\n// → 两份数据就此失步"}
          note="useState(value) 的初值只在首次渲染时被采用。把 props 拷进子组件 state,只在那一刻相等,之后必然失步——要共享就提升到父组件,不要复制。"
          noteClass="bad" logId="logs-d"
        >
          <CopyDemo logId="logs-d" />
        </Card>
      </div>

      <footer>
        本页面用 React 18 + Babel Standalone 在浏览器里现场编译 JSX,无需构建工具,联网状态下直接双击打开即可。
        <br />
        结论:① state 跟组件实例走,<code>{"<MyButton/>"}</code> 写两遍就是两份互不相干的 count;
        ② 要共享 → 提升到最近公共父组件:props 下发数据、回调上报变化;
        ③ 同一份数据只存一处(单一数据源),其余地方全部用 props 派生;
        ④ 把 props 拷进子组件 state 只拷到首次渲染的初值,之后必然失步。
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
